# Logrotate-Config für Hotel Display
# Wird vom Installer nach /etc/logrotate.d/hotel-display kopiert
/var/log/journal/**/hotel-display*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    postrotate
        systemctl restart rsyslog > /dev/null 2>&1 || true
    endscript
}
