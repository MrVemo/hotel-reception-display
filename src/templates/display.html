<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Reception Display</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: {{ branding.background_color }};
            color: #f0f0f0;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, {{ branding.header_gradient_from }}, {{ branding.header_gradient_to }});
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid {{ branding.primary_color }};
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .mode-tag {
            background: #34495e;
            color: #f0f0f0;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-right: 4px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .sort-btn, .login-btn, .admin-btn, .form-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f0f0f0;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            min-height: 44px;
            min-width: 44px;
        }

        .sort-btn.active {
            background: {{ branding.primary_color }};
            border-color: {{ branding.primary_color }};
        }

        .login-btn {
            background: {{ branding.done_color }};
            border-color: {{ branding.done_color }};
        }

        .items-container {
            padding: 20px;
            height: calc(100vh - 70px);
            overflow-y: auto;
        }

        .item {
            background: #2c3e50;
            border-left: 6px solid {{ branding.primary_color }};
            padding: 16px 20px;
            margin-bottom: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: transform 0.1s;
        }

        .item:active {
            transform: scale(0.98);
        }

        .item.urgent {
            border-left-color: {{ branding.urgent_color }};
            background: linear-gradient(90deg, #2c3e50, #3d2c2c);
        }

        .item.overdue {
            border-left-color: {{ branding.overdue_color }};
            background: linear-gradient(90deg, #2c3e50, #4a2c2c);
        }

        .item-text {
            flex: 1;
            font-size: 1.1rem;
            line-height: 1.4;
        }

        .item-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.85rem;
            color: #95a5a6;
            text-align: right;
        }

        .item-deadline {
            font-weight: 600;
            color: #ecf0f1;
        }

        .item-deadline.urgent {
            color: {{ branding.urgent_color }};
        }

        .item-deadline.overdue {
            color: {{ branding.overdue_color }};
            font-weight: 700;
        }

        .item-person {
            color: #f39c12;
            font-size: 0.9rem;
        }

        .checkbox {
            width: 36px;
            height: 36px;
            border: 3px solid #7f8c8d;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .checkbox.checked {
            background: {{ branding.done_color }};
            border-color: {{ branding.done_color }};
        }

        .checkbox.checked::after {
            content: "✓";
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
            font-size: 1.2rem;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .stats {
            font-size: 0.85rem;
            color: #95a5a6;
        }

        .last-update {
            font-size: 0.8rem;
            color: #7f8c8d;
        }

        /* Swipe-to-delete indicator */
        .swipe-hint {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #e74c3c;
            font-size: 1.5rem;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .item.swiping .swipe-hint {
            opacity: 1;
        }

        /* Login overlay */
        .login-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        .login-overlay.show { display: flex; }

        .login-overlay h2 {
            font-size: 1.5rem;
        }

        .code-display {
            display: flex;
            gap: 16px;
            margin: 8px 0;
        }
        .code-dot {
            width: 50px;
            height: 65px;
            background: #2c3e50;
            border: 2px solid #7f8c8d;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: white;
            transition: all 0.15s;
        }
        .code-dot.filled {
            border-color: #3498db;
            background: #34495e;
        }
        .code-dot.error {
            border-color: #e74c3c;
            background: #4a2c2c;
            animation: shake 0.4s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .touch-keyboard {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(4, 70px);
            gap: 10px;
            margin: 16px 0;
        }
        .kb-btn {
            background: #34495e;
            color: white;
            border: 1px solid #4a6278;
            border-radius: 8px;
            font-size: 1.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .kb-btn:active {
            transform: scale(0.95);
            background: #2c3e50;
        }
        .kb-btn.kb-clear,
        .kb-btn.kb-back {
            background: #7f8c8d;
            font-size: 1.4rem;
        }
        .kb-btn.kb-clear:active,
        .kb-btn.kb-back:active {
            background: #5d6d7e;
        }

        .login-buttons {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .login-submit {
            background: #27ae60;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            min-height: 50px;
        }

        .login-cancel {
            background: transparent;
            color: #95a5a6;
            border: 1px solid #7f8c8d;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .login-error {
            color: #e74c3c;
            font-size: 1rem;
            min-height: 1.5rem;
        }

        .who {
            color: #f39c12;
            font-weight: 600;
            margin-right: 12px;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1 style="display:flex;align-items:center;gap:12px;">
                {% if branding.logo_url %}
                <img src="{{ branding.logo_url }}" alt="Logo" style="height:64px;max-width:180px;object-fit:contain;">
                {% else %}
                <span>🏨 {{ branding.hotel_name }}</span>
                {% endif %}
            </h1>
            <div class="last-update" id="last-update">Lade…</div>
        </div>
        <div class="controls">
            <span class="mode-tag">📺 Anzeige</span>
            <span class="who" id="who"></span>
            <a class="form-btn" href="/display-web" target="_blank" rel="noopener" title="Responsive Web-Anzeige (PC/Handy)">🌐 Web</a>
            <a class="form-btn" href="/handover" title="Schicht-Übergabe-Log">📋 Übergabe</a>
            <button class="sort-btn active" id="sort-urgent" onclick="setSort('urgent')">Dringend</button>
            <button class="sort-btn" id="sort-newest" onclick="setSort('newest')">Neueste</button>
            <button class="form-btn" onclick="window.location='/form'">+ Neu</button>
            <button class="admin-btn" onclick="window.location='/admin'">⚙️</button>
            <button class="login-btn" id="login-btn" onclick="showLogin()">Login</button>
        </div>
    </header>

    <div class="items-container" id="items-container">
        <div class="empty-state">
            <div class="icon">📋</div>
            <div>Lade Items…</div>
        </div>
    </div>

    <!-- Login Overlay mit Touch-Tastatur -->
    <div class="login-overlay" id="login-overlay">
        <h2>Mitarbeiter-Login</h2>
        <p style="color:#95a5a6; font-size:0.9rem;">4-stelligen Code eingeben:</p>

        <!-- Code-Anzeige -->
        <div class="code-display">
            <div class="code-dot" data-idx="0"></div>
            <div class="code-dot" data-idx="1"></div>
            <div class="code-dot" data-idx="2"></div>
            <div class="code-dot" data-idx="3"></div>
        </div>

        <!-- Touch-Tastatur -->
        <div class="touch-keyboard">
            <button class="kb-btn" data-key="1">1</button>
            <button class="kb-btn" data-key="2">2</button>
            <button class="kb-btn" data-key="3">3</button>
            <button class="kb-btn" data-key="4">4</button>
            <button class="kb-btn" data-key="5">5</button>
            <button class="kb-btn" data-key="6">6</button>
            <button class="kb-btn" data-key="7">7</button>
            <button class="kb-btn" data-key="8">8</button>
            <button class="kb-btn" data-key="9">9</button>
            <button class="kb-btn kb-clear" data-key="clear" title="Alle löschen">⌫</button>
            <button class="kb-btn" data-key="0">0</button>
            <button class="kb-btn kb-back" data-key="back" title="Letzte Ziffer">←</button>
        </div>

        <div class="login-error" id="login-error"></div>

        <div class="login-buttons">
            <button class="login-submit" onclick="submitLogin()">Einloggen</button>
            <button class="login-cancel" onclick="hideLogin()">Abbrechen</button>
        </div>
    </div>

    <script>
        // ===== State =====
        let currentSort = 'urgent';
        let items = [];
        let employee = null;

        // ===== Initial =====
        document.addEventListener('DOMContentLoaded', () => {
            loadItems();
            loadWhoAmI();
            setInterval(loadItems, 5000); // alle 5s refresh
        });

        // ===== API: Items laden =====
        async function loadItems() {
            try {
                const res = await fetch('/items');
                const data = await res.json();
                items = data.items || [];
                renderItems();
                document.getElementById('last-update').textContent =
                    `Letzter Refresh: ${new Date().toLocaleTimeString('de-DE')}`;
            } catch (err) {
                console.error('Items laden fehlgeschlagen:', err);
            }
        }

        // ===== API: Whoami =====
        async function loadWhoAmI() {
            try {
                const res = await fetch('/whoami');
                const data = await res.json();
                if (data.logged_in) {
                    employee = data.employee;
                    document.getElementById('who').textContent = `👤 ${employee.name}`;
                    document.getElementById('login-btn').textContent = 'Logout';
                    document.getElementById('login-btn').onclick = logout;
                } else {
                    employee = null;
                    document.getElementById('who').textContent = '';
                    document.getElementById('login-btn').textContent = 'Login';
                    document.getElementById('login-btn').onclick = showLogin;
                }
            } catch (err) {
                console.error('Whoami fehlgeschlagen:', err);
            }
        }

        // ===== Sort =====
        function setSort(sort) {
            currentSort = sort;
            document.getElementById('sort-urgent').classList.toggle('active', sort === 'urgent');
            document.getElementById('sort-newest').classList.toggle('active', sort === 'newest');
            renderItems();
        }

        // ===== Render =====
        function renderItems() {
            const container = document.getElementById('items-container');

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">✨</div>
                        <div>Keine offenen Items — alles erledigt!</div>
                    </div>
                `;
                return;
            }

            // Sort
            let sorted = [...items];
            if (currentSort === 'urgent') {
                sorted.sort((a, b) => {
                    // Überfällige zuerst
                    const now = new Date();
                    const aOverdue = a.deadline && new Date(a.deadline) < now;
                    const bOverdue = b.deadline && new Date(b.deadline) < now;
                    if (aOverdue !== bOverdue) return aOverdue ? -1 : 1;
                    // Dann nach Deadline (früheste zuerst)
                    if (a.deadline && b.deadline) return new Date(a.deadline) - new Date(b.deadline);
                    if (a.deadline) return -1;
                    if (b.deadline) return 1;
                    // Sonst nach created_at
                    return new Date(a.created_at) - new Date(b.created_at);
                });
            } else {
                sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            }

            container.innerHTML = sorted.map(item => {
                const now = new Date();
                let deadlineClass = '';
                let itemClass = '';
                if (item.deadline) {
                    const dl = new Date(item.deadline);
                    const diffMs = dl - now;
                    if (diffMs < 0) {
                        deadlineClass = 'overdue';
                        itemClass = 'overdue';
                    } else if (diffMs < 4 * 60 * 60 * 1000) {
                        deadlineClass = 'urgent';
                        itemClass = 'urgent';
                    }
                }
                const deadlineText = item.deadline_display
                    ? `Bis ${item.deadline_display}`
                    : 'Keine Frist';
                const personText = item.assigned_to_name ? `→ ${item.assigned_to_name}` : '';

                return `
                    <div class="item ${itemClass}" data-id="${item.id}" onswipe>
                        <div class="checkbox" onclick="markDone(${item.id}, event)"></div>
                        <div class="item-text">${escapeHtml(item.text)}</div>
                        <div class="item-meta">
                            <span class="item-deadline ${deadlineClass}">${deadlineText}</span>
                            <span class="item-person">${escapeHtml(personText)}</span>
                            <span class="stats">von ${escapeHtml(item.created_by_name)}</span>
                        </div>
                    </div>
                `;
            }).join('');

            // Swipe-Handler anhängen
            attachSwipeHandlers();
        }

        // ===== Mark Done =====
        async function markDone(itemId, event) {
            event.stopPropagation();
            if (!employee) {
                showLogin();
                return;
            }
            try {
                const res = await fetch(`/items/${itemId}/done`, { method: 'POST' });
                const data = await res.json();
                if (data.ok) {
                    loadItems(); // Sofort refresh
                } else {
                    alert('Fehler: ' + (data.error || 'unknown'));
                }
            } catch (err) {
                alert('Netzwerkfehler: ' + err.message);
            }
        }

        // ===== Swipe-to-Delete (Touch) =====
        function attachSwipeHandlers() {
            const els = document.querySelectorAll('.item');
            els.forEach(el => {
                let startX = 0;
                let startY = 0;
                let isSwiping = false;

                el.addEventListener('touchstart', (e) => {
                    if (!employee) return;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    isSwiping = true;
                }, { passive: true });

                el.addEventListener('touchmove', (e) => {
                    if (!isSwiping) return;
                    const dx = e.touches[0].clientX - startX;
                    const dy = e.touches[0].clientY - startY;
                    // Nur horizontal swipes
                    if (Math.abs(dx) > Math.abs(dy) && dx < -50) {
                        el.classList.add('swiping');
                        el.style.transform = `translateX(${Math.max(dx, -200)}px)`;
                    }
                }, { passive: true });

                el.addEventListener('touchend', async (e) => {
                    if (!isSwiping) return;
                    isSwiping = false;
                    const dx = e.changedTouches[0].clientX - startX;
                    if (dx < -100) {
                        // Confirm + delete
                        if (confirm('Item löschen?')) {
                            const id = el.dataset.id;
                            await deleteItem(id);
                        }
                    }
                    el.classList.remove('swiping');
                    el.style.transform = '';
                });
            });
        }

        async function deleteItem(id) {
            try {
                const res = await fetch(`/items/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.ok) loadItems();
            } catch (err) {
                alert('Löschen fehlgeschlagen: ' + err.message);
            }
        }

        // ===== Login =====
        function showLogin() {
            document.getElementById('login-overlay').classList.add('show');
            document.getElementById('login-error').textContent = '';
            if (typeof window.__clearCodeBuffer === 'function') window.__clearCodeBuffer();
        }

        function hideLogin() {
            document.getElementById('login-overlay').classList.remove('show');
            if (typeof window.__clearCodeBuffer === 'function') window.__clearCodeBuffer();
        }

        async function submitLogin() {
            const digits = (typeof window.__getCodeBuffer === 'function') ? window.__getCodeBuffer() : '';
            if (digits.length !== 4) {
                document.getElementById('login-error').textContent = 'Bitte 4 Ziffern eingeben';
                return;
            }
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: digits })
                });
                const data = await res.json();
                if (data.ok) {
                    hideLogin();
                    loadWhoAmI();
                    loadItems();
                } else {
                    document.getElementById('login-error').textContent = data.error || 'Login fehlgeschlagen';
                }
            } catch (err) {
                document.getElementById('login-error').textContent = 'Netzwerkfehler';
            }
        }

        async function logout() {
            try {
                await fetch('/logout', { method: 'POST' });
                loadWhoAmI();
                loadItems();
            } catch (err) {
                console.error('Logout fehlgeschlagen:', err);
            }
        }

// Auto-Advance entfernt — Touch-Tastatur hat eigenen Auto-Submit

        // ===== Utilities =====
        function escapeHtml(s) {
            if (!s) return '';
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
    </script>

    <!-- ===== IP-Footer ===== -->
    <div id="ip-footer" class="ip-footer">
        <span class="ip-label">📶</span>
        <span class="ip-value" id="ip-lan" title="Klicken zum Kopieren">…</span>
        <span class="ip-sep">·</span>
        <span class="ip-value" id="ip-host" style="color:#7f8c8d">…</span>
    </div>

    <style>
        .ip-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.5);
            color: #95a5a6;
            font-size: 0.7rem;
            padding: 3px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: ui-monospace, "SF Mono", Consolas, monospace;
            z-index: 100;
            height: 22px;
        }
        .ip-footer .ip-label {
            color: #7f8c8d;
        }
        .ip-footer .ip-value {
            color: #bdc3c7;
            cursor: pointer;
        }
        .ip-footer .ip-value:hover {
            color: #3498db;
            text-decoration: underline;
        }
        .ip-footer .ip-sep {
            color: #34495e;
        }
    </style>

    <script>
    // ===== Touch-Tastatur (Login) =====
    (function() {
        let codeBuffer = '';
        function updateCodeDisplay() {
            document.querySelectorAll('.code-dot').forEach((dot, i) => {
                dot.classList.toggle('filled', i < codeBuffer.length);
                dot.textContent = codeBuffer[i] || '';
            });
        }
        window.__getCodeBuffer = () => codeBuffer;
        window.__clearCodeBuffer = () => {
            codeBuffer = '';
            updateCodeDisplay();
        };
        document.querySelectorAll('.kb-btn').forEach(btn => {
            const handler = (e) => {
                e.preventDefault();
                const key = btn.dataset.key;
                if (key === 'clear') {
                    codeBuffer = '';
                    const err = document.getElementById('login-error');
                    if (err) err.textContent = '';
                } else if (key === 'back') {
                    codeBuffer = codeBuffer.slice(0, -1);
                } else if (/^[0-9]$/.test(key)) {
                    if (codeBuffer.length < 4) {
                        codeBuffer += key;
                        if (codeBuffer.length === 4) {
                            setTimeout(() => {
                                if (typeof submitLogin === 'function') {
                                    submitLogin();
                                }
                            }, 200);
                        }
                    }
                }
                updateCodeDisplay();
            };
            btn.addEventListener('click', handler);
            btn.addEventListener('touchstart', handler, {passive: false});
        });
        // Initial: Update display once DOM is ready
        updateCodeDisplay();
    })();
</script>
<script>
    // ===== IP-Anzeige =====
    (function() {
        function updateNetworkInfo() {
            fetch('/api/network')
                .then(r => r.json())
                .then(info => {
                    const port = info.port || 5000;
                    const lanEl = document.getElementById('ip-lan');
                    const vpnEl = document.getElementById('ip-vpn');
                    const hostEl = document.getElementById('ip-host');
                    if (lanEl) {
                        lanEl.textContent = info.lan_ip
                            ? `${info.lan_ip}:${port}`
                            : '—';
                        lanEl.title = 'Klicken zum Kopieren';
                        lanEl.onclick = () => copyToClipboard(info.lan_ip + ':' + port);
                    }
                    if (hostEl) {
                        hostEl.textContent = info.hostname || '—';
                    }
                })
                .catch(err => {
                    console.error('Netzwerk-Info laden fehlgeschlagen:', err);
                });
        }

        function copyToClipboard(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(`📋 Kopiert: ${text}`);
                }).catch(err => {
                    console.error('Copy failed:', err);
                });
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
                background: #27ae60; color: white; padding: 8px 16px; border-radius: 6px;
                z-index: 9999; font-size: 0.9rem;
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // Initial + alle 60 Sekunden refreshen (Tailscale-IP kann sich ändern)
        updateNetworkInfo();
        setInterval(updateNetworkInfo, 60000);
        // Backup: alle 5 Minuten Page-Reload (falls JS hängt)
        setTimeout(() => location.reload(), 300000);

    })();
    </script>

</body>
</html>
