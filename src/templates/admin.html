<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Hotel Reception</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #f0f0f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #34495e;
        }

        h1 {
            font-size: 1.6rem;
        }

        .back-btn {
            background: #34495e;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            min-height: 44px;
        }

        .who {
            background: #2c3e50;
            padding: 10px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            color: #f39c12;
            font-size: 0.95rem;
        }

        .who.not-logged-in {
            background: #3d2c2c;
            color: #e74c3c;
        }

        /* Mitarbeiter-Liste */
        .employees {
            margin-bottom: 32px;
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: #95a5a6;
        }

        .employee {
            background: #2c3e50;
            border-left: 4px solid #27ae60;
            padding: 16px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 16px;
            align-items: center;
        }

        .employee.inactive {
            opacity: 0.5;
            border-left-color: #7f8c8d;
        }

        .employee-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .employee-name {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .employee-code {
            font-family: 'Courier New', monospace;
            font-size: 1.4rem;
            color: #f39c12;
            letter-spacing: 4px;
        }

        .employee-meta {
            font-size: 0.85rem;
            color: #95a5a6;
        }

        .edit-btn, .toggle-btn, .delete-btn {
            background: transparent;
            border: 1px solid #7f8c8d;
            color: #f0f0f0;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            min-height: 44px;
            min-width: 80px;
        }

        .edit-btn:active { background: #34495e; }
        .delete-btn { border-color: #e74c3c; color: #e74c3c; }
        .delete-btn:active { background: #3d2c2c; }
        .toggle-btn.off { border-color: #27ae60; color: #27ae60; }

        /* Neuer Mitarbeiter Form */
        .add-form {
            background: #2c3e50;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 12px;
            margin-bottom: 12px;
        }

        input[type="text"], input[type="number"] {
            padding: 14px;
            font-size: 1rem;
            background: #34495e;
            border: 2px solid transparent;
            color: #f0f0f0;
            border-radius: 6px;
            min-height: 44px;
        }

        input:focus { outline: none; border-color: #3498db; }

        .generate-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            min-height: 44px;
            white-space: nowrap;
        }

        .add-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            min-height: 50px;
        }

        .add-btn:active { background: #229954; }
        .add-btn:disabled { background: #555; cursor: not-allowed; }

        .error, .success {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
        }

        .error { background: #3d2c2c; color: #e74c3c; }
        .success { background: #1e3d2c; color: #27ae60; }
        .error.show, .success.show { display: block; }

        .empty {
            text-align: center;
            padding: 30px;
            color: #7f8c8d;
        }

        /* Login-Overlay (gleich wie form/display) */
        .login-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        .login-overlay.show { display: flex; }

        .login-overlay h2 { font-size: 1.5rem; }

        .code-input { display: flex; gap: 12px; }

        .code-digit {
            width: 60px;
            height: 80px;
            font-size: 2.5rem;
            text-align: center;
            background: #2c3e50;
            border: 2px solid #7f8c8d;
            color: white;
            border-radius: 8px;
        }

        .code-digit:focus { outline: none; border-color: #3498db; }

        .login-submit {
            background: #27ae60;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            min-height: 50px;
        }

        .login-cancel {
            background: transparent;
            color: #95a5a6;
            border: 1px solid #7f8c8d;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .login-error {
            color: #e74c3c;
            font-size: 1rem;
            min-height: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;"><span style="background:#e67e22;color:white;padding:6px 12px;border-radius:6px;font-size:0.85rem;font-weight:600;">⚙️ Admin-Modus</span><a href="/?mode=display" style="margin-left:auto;color:#95a5a6;text-decoration:none;font-size:0.85rem;">📺 Zur Anzeige</a></div>
<h1>⚙️ Admin — Mitarbeiter</h1>
            <button class="back-btn" onclick="window.location='/'">← Display</button>
        </header>

    <nav class="tab-nav">
        <button class="tab-btn active" data-tab="employees">👥 Mitarbeiter</button>
        <button class="tab-btn" data-tab="branding">🎨 Branding</button>
    </nav>

    <style>
        .tab-nav {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid #34495e;
        }
        .tab-btn {
            background: transparent;
            color: #95a5a6;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }
        .tab-btn.active {
            color: #f0f0f0;
            border-bottom-color: #3498db;
        }
        .tab-content { display: block; }
        .tab-content.hidden { display: none; }
    </style>


        <div class="who" id="who">Lade…</div>

        <div class="error" id="error"></div>
        <div class="success" id="success"></div>

        <!-- Login-Pflicht Bereich (versteckt wenn eingeloggt) -->
        <div id="main-content" style="display: none;">
            <!-- Neuer Mitarbeiter -->
            <div class="add-form">
                
    <div id="tab-employees" class="tab-content">
        <h2 style="margin-top: 0;">➕ Neuer Mitarbeiter</h2>
                <div class="form-row">
                    <input type="text" id="new-name" placeholder="Name (z.B. Maria Schmidt)" maxlength="50">
                    <input type="text" id="new-code" placeholder="Code" maxlength="4" pattern="[0-9]{4}" inputmode="numeric">
                    <button class="generate-btn" onclick="generateCode()">🎲 Zufall</button>
                </div>
                <button class="add-btn" id="add-btn" onclick="addEmployee()">✅ Anlegen</button>
            </div>

            <!-- Bestehende Mitarbeiter -->
            <div class="employees">
                <h2>📋 Aktive Mitarbeiter</h2>
                <div id="employees-list"></div>
            </div>
        </div>
    </div>

    <!-- Login Overlay -->
    <!-- Login Overlay mit Touch-Tastatur -->
    <div class="login-overlay" id="login-overlay">
        <h2>Mitarbeiter-Login</h2>
        <p style="color:#95a5a6; font-size:0.9rem;">4-stelligen Code eingeben:</p>

        <div class="code-display">
            <div class="code-dot" data-idx="0"></div>
            <div class="code-dot" data-idx="1"></div>
            <div class="code-dot" data-idx="2"></div>
            <div class="code-dot" data-idx="3"></div>
        </div>

        <div class="touch-keyboard">
            <button class="kb-btn" data-key="1">1</button>
            <button class="kb-btn" data-key="2">2</button>
            <button class="kb-btn" data-key="3">3</button>
            <button class="kb-btn" data-key="4">4</button>
            <button class="kb-btn" data-key="5">5</button>
            <button class="kb-btn" data-key="6">6</button>
            <button class="kb-btn" data-key="7">7</button>
            <button class="kb-btn" data-key="8">8</button>
            <button class="kb-btn" data-key="9">9</button>
            <button class="kb-btn kb-clear" data-key="clear" title="Alle löschen">⌫</button>
            <button class="kb-btn" data-key="0">0</button>
            <button class="kb-btn kb-back" data-key="back" title="Letzte Ziffer">←</button>
        </div>

        <div class="login-error" id="login-error"></div>

        <div class="login-buttons">
            <button class="login-submit" onclick="submitLogin()">Einloggen</button>
            <button class="login-cancel" onclick="hideLogin()">Abbrechen</button>
        </div>
    </div>

    <script>
    (function() {
        const COLOR_FIELDS = [
            {key: "primary_color", label: "Primärfarbe (Buttons, Akzente)"},
            {key: "header_gradient_from", label: "Header-Verlauf (von)"},
            {key: "header_gradient_to", label: "Header-Verlauf (nach)"},
            {key: "background_color", label: "Hintergrund"},
            {key: "urgent_color", label: "Dringend"},
            {key: "overdue_color", label: "Überfällig"},
            {key: "done_color", label: "Erledigt"}
        ];

        // Farbfelder dynamisch erstellen
        const colorFieldsContainer = document.getElementById('color-fields');
        COLOR_FIELDS.forEach(({key, label}) => {
            const id = key.replace(/_/g, '-');
            colorFieldsContainer.innerHTML += `
                <label style="display: flex; justify-content: space-between; align-items: center; margin: 10px 0;">
                    <span>${label}:</span>
                    <input type="color" id="${id}" name="${key}" style="width: 50px; height: 30px; border: 1px solid #555; border-radius: 4px; cursor: pointer;">
                </label>
            `;
        });

        // Config laden
        fetch('/api/branding').then(r => r.json()).then(cfg => {
            document.getElementById('hotel-name').value = cfg.hotel_name || '';
            COLOR_FIELDS.forEach(({key}) => {
                const el = document.getElementById(key.replace(/_/g, '-'));
                if (el && cfg[key]) el.value = cfg[key];
            });
        });

        // Form-Submit
        document.getElementById('branding-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            const status = document.getElementById('branding-status');
            status.textContent = 'Speichere...';
            status.style.background = '#34495e';
            try {
                const res = await fetch('/api/branding', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.ok) {
                    status.textContent = '✅ Gespeichert! Display lädt die neuen Farben in 5 Sekunden.';
                    status.style.background = '#27ae60';
                    document.getElementById('preview-frame').contentWindow.location.reload();
                } else {
                    status.textContent = '❌ Fehler: ' + (result.error || 'unknown');
                    status.style.background = '#c0392b';
                }
            } catch (err) {
                status.textContent = '❌ Netzwerkfehler: ' + err.message;
                status.style.background = '#c0392b';
            }
        });

        // Reset
        document.getElementById('btn-reset').addEventListener('click', async () => {
            if (!confirm('Wirklich auf Standard zurücksetzen?')) return;
            try {
                const res = await fetch('/api/branding/reset', {method: 'POST'});
                const result = await res.json();
                if (result.ok) {
                    document.getElementById('hotel-name').value = result.config.hotel_name || '';
                    COLOR_FIELDS.forEach(({key}) => {
                        const el = document.getElementById(key.replace(/_/g, '-'));
                        if (el && result.config[key]) el.value = result.config[key];
                    });
                    document.getElementById('preview-frame').contentWindow.location.reload();
                }
            } catch (err) {
                alert('Fehler: ' + err.message);
            }
        });

        // Preview refresh
        document.getElementById('btn-preview').addEventListener('click', () => {
            document.getElementById('preview-frame').contentWindow.location.reload();
        });
    })();
    </script>

    
    <script>
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const target = btn.dataset.tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('hidden', c.id !== 'tab-' + target));
        });
    });
    </script>

<script>
    // ===== Login & Mitarbeiter laden =====
    let currentEmployee = null;
    let employees = [];

    async function loadWhoAmI() {
        try {
            const res = await fetch('/whoami');
            const data = await res.json();
            if (data.employee) {
                currentEmployee = data.employee;
                document.getElementById('who').innerHTML =
                    `Eingeloggt als <strong>${escapeHtml(data.employee.name)}</strong> ` +
                    `<button class="logout-btn" onclick="logout()">Abmelden</button>`;
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('login-overlay').classList.remove('show');
                if (typeof window.__clearCodeBuffer === 'function') window.__clearCodeBuffer();
                loadEmployees();
            } else {
                currentEmployee = null;
                document.getElementById('who').textContent = 'Nicht eingeloggt';
                document.getElementById('main-content').style.display = 'none';
                // ShowLogin nur automatisch wenn keine Aktion läuft
                // (sonst: User kann garnicht erst auf Login-Button klicken)
            }
        } catch (err) {
            console.error('whoami-Fehler:', err);
            document.getElementById('who').textContent = 'Fehler beim Laden';
        }
    }

    function showLogin() {
        document.getElementById('login-overlay').classList.add('show');
        if (typeof window.__clearCodeBuffer === 'function') window.__clearCodeBuffer();
    }

    function hideLogin() {
        document.getElementById('login-overlay').classList.remove('show');
        if (typeof window.__clearCodeBuffer === 'function') window.__clearCodeBuffer();
    }

    async function submitLogin() {
        const code = (typeof window.__getCodeBuffer === 'function') ? window.__getCodeBuffer() : '';
        if (code.length !== 4) {
            document.getElementById('login-error').textContent = 'Bitte 4 Ziffern eingeben';
            return;
        }
        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            });
            const data = await res.json();
            if (data.ok) {
                hideLogin();
                loadWhoAmI();
            } else {
                document.getElementById('login-error').textContent = data.error || 'Login fehlgeschlagen';
            }
        } catch (err) {
            document.getElementById('login-error').textContent = 'Netzwerkfehler';
        }
    }

    async function logout() {
        try {
            await fetch('/logout', { method: 'POST' });
            loadWhoAmI();
        } catch (err) {
            console.error('Logout fehlgeschlagen:', err);
        }
    }

    async function loadEmployees() {
        const list = document.getElementById('employees-list');
        list.innerHTML = '<div style="color:#95a5a6;">Lade…</div>';
        try {
            const res = await fetch('/api/employees');
            if (!res.ok) {
                list.innerHTML = '<div style="color:#e74c3c;">Fehler beim Laden (Status ' + res.status + ')</div>';
                return;
            }
            const data = await res.json();
            employees = data.employees || [];
            if (employees.length === 0) {
                list.innerHTML = '<div style="color:#95a5a6;">Noch keine Mitarbeiter angelegt</div>';
                return;
            }
            list.innerHTML = employees.map(emp => `
                <div class="employee-row">
                    <div>
                        <strong>${escapeHtml(emp.name)}</strong>
                        <span style="color:#7f8c8d; margin-left:8px;">Code: ${emp.code}</span>
                        ${emp.is_admin ? '<span class="admin-badge">Admin</span>' : ''}
                    </div>
                    <div>
                        <button class="edit-btn" onclick="editEmployee(${emp.id})">✏️</button>
                        <button class="delete-btn" onclick="deleteEmployee(${emp.id})">🗑️</button>
                    </div>
                </div>
            `).join('');
        } catch (err) {
            console.error('Mitarbeiter laden fehlgeschlagen:', err);
            list.innerHTML = '<div style="color:#e74c3c;">Netzwerkfehler</div>';
        }
    }

    function escapeHtml(s) {
        if (!s) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                       .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    // Login-Button muss showLogin() triggern
    document.addEventListener('DOMContentLoaded', () => {
        // Falls eingeloggt → direkt wer anzeigen; sonst Login-Overlay zeigen
        loadWhoAmI();
    });

    // Falls who-text "Nicht eingeloggt" ist, klick darauf zeigt Login
    document.getElementById('who').addEventListener('click', () => {
        if (!currentEmployee) showLogin();
    });
</script>


<script>
        // ===== Touch-Tastatur (Login) =====
        (function() {
            let codeBuffer = '';
            function updateCodeDisplay() {
                document.querySelectorAll('.code-dot').forEach((dot, i) => {
                    dot.classList.toggle('filled', i < codeBuffer.length);
                    dot.textContent = codeBuffer[i] || '';
                });
            }
            window.__getCodeBuffer = () => codeBuffer;
            window.__clearCodeBuffer = () => {
                codeBuffer = '';
                updateCodeDisplay();
            };
            document.querySelectorAll('.kb-btn').forEach(btn => {
                const handler = (e) => {
                    e.preventDefault();
                    const key = btn.dataset.key;
                    if (key === 'clear') {
                        codeBuffer = '';
                        document.getElementById('login-error').textContent = '';
                    } else if (key === 'back') {
                        codeBuffer = codeBuffer.slice(0, -1);
                    } else if (/^[0-9]$/.test(key)) {
                        if (codeBuffer.length < 4) {
                            codeBuffer += key;
                            if (codeBuffer.length === 4) {
                                setTimeout(submitLogin, 200);
                            }
                        }
                    }
                    updateCodeDisplay();
                };
                btn.addEventListener('click', handler);
                btn.addEventListener('touchstart', handler, {passive: false});
            });
        })();
</script>
