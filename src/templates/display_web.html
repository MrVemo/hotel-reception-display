<!DOCTYPE html>
<html lang="de" data-theme="{{ branding.theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="{{ branding.primary_color }}">
    <title>{{ branding.hotel_name }} — Anzeige</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        /* ===== Reset & Basis ===== */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration: none; }

        /* ===== Branding-Akzentfarben (live überschreibbar via JS) =====
           --bg/--text/etc. kommen aus theme.css (Hell/Dunkel), hier nur
           die vom Hotel gewaehlten Akzentfarben. */
        :root {
            --primary: {{ branding.primary_color }};
            --header-from: {{ branding.header_gradient_from }};
            --header-to: {{ branding.header_gradient_to }};
            --urgent: {{ branding.urgent_color }};
            --overdue: {{ branding.overdue_color }};
            --done: {{ branding.done_color }};
        }

        /* ===== Header ===== */
        header.site-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: var(--shadow-sm);
        }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .brand img { max-height: 44px; max-width: 160px; object-fit: contain; }
        .brand h1 { margin: 0; font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .brand .subtitle { font-size: 0.8rem; color: var(--text-dim); }

        .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 7px 13px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.85rem;
            font-family: var(--font-body);
            transition: background 0.15s, border-color 0.15s;
        }
        .btn:hover { border-color: var(--text-dim); }
        .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
        .btn.primary:hover { filter: brightness(1.08); }
        .btn.success { background: var(--done); border-color: var(--done); color: #fff; }
        .btn.danger { background: transparent; border-color: var(--overdue); color: var(--overdue); }
        .btn.danger:hover { background: var(--overdue); color: white; }
        .btn.ghost { background: transparent; }
        .btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

        .who-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 10px; border-radius: var(--radius-sm);
            background: rgba(243, 156, 18, 0.15);
            color: #c9820f; font-size: 0.82rem; font-weight: 600;
        }
        :root[data-theme="dark"] .who-badge { color: #f39c12; }

        /* ===== Main Content ===== */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .toolbar .left, .toolbar .right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .last-update { font-size: 0.8rem; color: var(--text-dim); }
        .last-update .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--done); margin-right: 6px; vertical-align: middle; }
        .last-update.stale .dot { background: var(--text-dim); }
        .last-update.error .dot { background: var(--overdue); }

        .stats-line { font-size: 0.85rem; color: var(--text-dim); }

        /* ===== Item-Grid ===== */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px;
        }
        @media (max-width: 600px) {
            .items-grid { grid-template-columns: 1fr; gap: 10px; }
            main { padding: 12px; }
            header.site-header { padding: 10px 12px; }
            .brand img { max-height: 36px; max-width: 120px; }
        }

        .item-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 5px solid var(--primary);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            transition: transform 0.1s, box-shadow 0.15s;
            box-shadow: var(--shadow-sm);
        }
        .item-card:hover { box-shadow: var(--shadow-md); }
        .item-card.urgent { border-left-color: var(--urgent); }
        .item-card.overdue { border-left-color: var(--overdue); }

        .item-checkbox {
            width: 30px; height: 30px; flex-shrink: 0;
            border: 2px solid var(--border); border-radius: var(--radius-sm);
            background: transparent; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s; padding: 0;
            margin-top: 2px;
        }
        .item-checkbox:hover { border-color: var(--done); }
        .item-checkbox.checked { background: var(--done); border-color: var(--done); }
        .item-checkbox.checked::after { content: "✓"; color: white; font-size: 1.3rem; font-weight: bold; }

        .item-body { flex: 1; min-width: 0; }
        .item-text { font-size: 0.98rem; line-height: 1.4; margin-bottom: 8px; word-wrap: break-word; }
        .item-meta {
            display: flex; flex-direction: column; gap: 2px;
            font-size: 0.8rem; color: var(--text-dim);
        }
        .item-deadline { font-weight: 600; color: var(--text); }
        .item-deadline.urgent { color: var(--urgent); }
        .item-deadline.overdue { color: var(--overdue); font-weight: 700; }
        .item-person { color: var(--primary); }
        .item-creator { color: var(--text-dim); font-size: 0.76rem; }

        .item-actions {
            display: flex; flex-direction: column; gap: 4px; flex-shrink: 0;
        }
        .icon-btn {
            background: transparent; border: 1px solid transparent;
            color: var(--text-dim); cursor: pointer;
            width: 30px; height: 30px; border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.95rem; padding: 0;
            transition: all 0.15s;
        }
        .icon-btn:hover { background: rgba(231, 76, 60, 0.12); border-color: var(--overdue); color: var(--overdue); }
        .icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center; padding: 60px 20px; color: var(--text-dim);
            background: var(--surface); border-radius: var(--radius-md); border: 1px dashed var(--border);
        }
        .empty-state .icon { font-size: 2.6rem; margin-bottom: 12px; }
        .empty-state .title { font-size: 1.05rem; margin-bottom: 6px; color: var(--text); }

        /* ===== Login-Modal ===== */
        .modal-backdrop {
            display: none; position: fixed; inset: 0;
            background: var(--overlay);
            z-index: 1000; align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-backdrop.show { display: flex; }
        .modal {
            background: var(--surface-raised); border-radius: var(--radius-lg); padding: 24px;
            max-width: 380px; width: 100%;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }
        .modal h2 { margin: 0 0 12px; font-family: var(--font-display); font-size: 1.25rem; color: var(--text); }
        .modal p { color: var(--text-dim); font-size: 0.9rem; margin: 0 0 16px; }
        .modal .form-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .modal label { font-size: 0.85rem; color: var(--text-dim); }
        .modal input[type="text"], .modal input[type="password"] {
            background: var(--surface-alt); border: 1px solid var(--border);
            color: var(--text); padding: 10px 12px; border-radius: var(--radius-sm);
            font-size: 1.4rem; letter-spacing: 0.5em; text-align: center;
            font-family: ui-monospace, "SF Mono", Consolas, monospace;
        }
        .modal input:focus { outline: none; border-color: var(--primary); }
        .modal .actions { display: flex; gap: 8px; justify-content: flex-end; }
        .modal .error { color: var(--overdue); font-size: 0.85rem; min-height: 1.2em; margin-bottom: 8px; }

        /* ===== Toast ===== */
        .toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
        .toast {
            background: var(--surface-raised); color: var(--text); padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm); font-size: 0.9rem;
            box-shadow: var(--shadow-md);
            animation: toastIn 0.2s ease-out;
            pointer-events: auto;
        }
        .toast.success { background: var(--done); border-color: var(--done); color: #fff; }
        .toast.error { background: var(--overdue); border-color: var(--overdue); color: #fff; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== IP-Footer ===== */
        .ip-footer {
            text-align: center; padding: 8px 12px;
            background: var(--surface); color: var(--text-dim);
            font-size: 0.75rem; font-family: ui-monospace, "SF Mono", Consolas, monospace;
            border-top: 1px solid var(--border); margin-top: 30px;
        }
        .ip-footer code { color: var(--text); cursor: pointer; padding: 2px 6px; border-radius: 3px; }
        .ip-footer code:hover { background: var(--surface-alt); color: var(--primary); }
        .ip-footer a { color: var(--text-dim); }
        .ip-footer a:hover { color: var(--primary); text-decoration: underline; }
    </style>
</head>
<body>

<header class="site-header">
    <div class="brand">
        <img id="logo" src="{{ branding.logo_url or '' }}" alt="" style="display:{{ 'inline-block' if branding.logo_url else 'none' }};">
        <div id="hotel-name" style="display:{{ 'none' if branding.logo_url else 'block' }};">🏨 {{ branding.hotel_name }}</div>
    </div>
    <div class="controls">
        <span class="who-badge" id="who-badge" style="display:none;">👤 <span id="who-name"></span></span>
        <button class="btn" id="sort-urgent" onclick="setSort('urgent')">Dringend</button>
        <button class="btn" id="sort-newest" onclick="setSort('newest')">Neueste</button>
        <a class="btn primary" href="/form" target="_blank" rel="noopener">+ Neu</a>
        <button class="theme-toggle" data-theme-toggle title="Design umschalten">🌙</button>
        <div class="menu-wrap">
            <button class="menu-trigger" aria-expanded="false" title="Weitere Optionen">⋮</button>
            <div class="menu-dropdown">
                <a href="/?view=display" title="Kiosk-Anzeige (Touch)"><span class="icon">📺</span> Kiosk-Anzeige</a>
                <a href="/handover"><span class="icon">📋</span> Übergabe</a>
                <a href="/admin"><span class="icon">⚙️</span> Admin</a>
            </div>
        </div>
        <button class="btn success" id="login-btn" onclick="showLogin()">Login</button>
    </div>
</header>

<main>
    <div class="toolbar">
        <div class="left">
            <span class="last-update" id="last-update"><span class="dot"></span>Lade…</span>
            <span class="stats-line" id="stats-line"></span>
        </div>
        <div class="right">
            <button class="btn ghost" onclick="loadItems(true)" title="Jetzt aktualisieren">↻ Refresh</button>
        </div>
    </div>

    <div id="items-container">
        <div class="empty-state">
            <div class="icon">📋</div>
            <div>Lade Aufgaben…</div>
        </div>
    </div>
</main>

<!-- Login Modal -->
<div class="modal-backdrop" id="login-modal">
    <div class="modal">
        <h2>Mitarbeiter-Login</h2>
        <p>4-stelligen Code eingeben, um Aufgaben abhaken oder löschen zu können.</p>
        <form id="login-form" onsubmit="return submitLogin(event)">
            <div class="form-row">
                <label for="code-input">Code</label>
                <input type="password" id="code-input" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="off" autofocus>
            </div>
            <div class="error" id="login-error"></div>
            <div class="actions">
                <button type="button" class="btn ghost" onclick="hideLogin()">Abbrechen</button>
                <button type="submit" class="btn primary" id="login-submit">Einloggen</button>
            </div>
        </form>
    </div>
</div>

<div class="ip-footer">
    <span>📶 <code id="ip-lan" title="Klicken zum Kopieren">…</code></span>
    <span style="margin: 0 8px;">·</span>
    <span id="ip-host">…</span>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
    // ===== State =====
    let currentSort = localStorage.getItem('webSort') || 'urgent';
    let items = [];
    let employee = null;
    let pollHandle = null;
    let networkHandle = null;
    let brandingHandle = null;
    let isLoading = false;
    let locked = true; // Default: gesperrt, bis /whoami eine gueltige Session bestaetigt

    // Idle-Timeout: muss zum Backend (app.py IDLE_TIMEOUT_SECONDS) passen.
    // Rein clientseitig fuer sofortiges Sperren, Backend erzwingt denselben
    // Timeout serverseitig als Backstop (get_current_employee()).
    const IDLE_TIMEOUT_MS = 5 * 60 * 1000;
    let idleTimer = null;
    let lastActivityPing = 0;

    // ===== Sperr-Bildschirm =====
    function lockScreen() {
        locked = true;
        items = [];
        clearTimeout(idleTimer);
        const container = document.getElementById('items-container');
        container.innerHTML = `
            <div class="empty-state">
                <div class="icon">🔒</div>
                <div class="title">Gesperrt</div>
                <div>Aufgaben und Übergabeprotokoll sind nur für eingeloggte Mitarbeiter sichtbar. <a href="#" onclick="showLogin(); return false;" style="color:var(--primary);text-decoration:underline;">Jetzt einloggen</a>.</div>
            </div>
        `;
        document.getElementById('stats-line').textContent = '';
        showLogin();
    }

    function unlockScreen() {
        locked = false;
        resetIdleTimer();
    }

    function resetIdleTimer() {
        clearTimeout(idleTimer);
        if (locked) return;
        idleTimer = setTimeout(logout, IDLE_TIMEOUT_MS);
    }

    function pingActivity() {
        if (locked) return;
        resetIdleTimer();
        const now = Date.now();
        if (now - lastActivityPing < 20000) return; // throttle, nicht bei jedem Touch pingen
        lastActivityPing = now;
        fetch('/api/touch', { method: 'POST' }).catch(() => {});
    }
    ['touchstart', 'mousedown', 'keydown'].forEach(evt => {
        document.addEventListener(evt, pingActivity, { passive: true });
    });

    // ===== Initial =====
    document.addEventListener('DOMContentLoaded', () => {
        // Sort-Buttons initial markieren
        setSort(currentSort, false);

        loadWhoAmI();
        loadNetworkInfo();
        loadBranding();

        // Polling-Intervalle (mehrere Sekunden leichte Verzögerung ist okay)
        pollHandle = setInterval(loadItems, 5000);
        networkHandle = setInterval(loadNetworkInfo, 60000);
        brandingHandle = setInterval(loadBranding, 30000);

        // Login-Modal: ESC schließt (nur wenn schon eingeloggt - sonst gibt's
        // nichts zu sehen ausser dem Sperr-Platzhalter)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !locked) hideLogin();
        });

        // IP-Footer: Click-to-Copy
        document.getElementById('ip-lan').addEventListener('click', (e) => {
            const text = e.target.textContent;
            if (text && text !== '…') copyToClipboard(text);
        });

        // Login-Input: nur Ziffern erlauben
        document.getElementById('code-input').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
        });

        // Tab-Sichtbarkeit: bei Rückkehr sofort refreshen
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) loadItems(true);
        });
    });

    // ===== Sort =====
    function setSort(sort, persist = true) {
        currentSort = sort;
        if (persist) localStorage.setItem('webSort', sort);
        document.getElementById('sort-urgent').classList.toggle('active', sort === 'urgent');
        document.getElementById('sort-newest').classList.toggle('active', sort === 'newest');
        renderItems();
    }

    // ===== API: Items laden =====
    async function loadItems(silent = false) {
        if (locked) return; // kein Polling waehrend gesperrt (nichts zu holen)
        if (isLoading) return;
        isLoading = true;
        try {
            const res = await fetch('/items', { cache: 'no-store' });
            if (res.status === 401) {
                lockScreen(); // Session serverseitig abgelaufen (Idle-Timeout)
                return;
            }
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            items = data.items || [];
            renderItems();
            updateLastUpdate(true);
        } catch (err) {
            console.error('Items laden fehlgeschlagen:', err);
            updateLastUpdate(false, err.message);
            if (!silent) showToast('Refresh fehlgeschlagen', 'error');
        } finally {
            isLoading = false;
        }
    }

    function updateLastUpdate(ok, msg) {
        const el = document.getElementById('last-update');
        const now = new Date().toLocaleTimeString('de-DE');
        if (ok) {
            el.className = 'last-update';
            el.innerHTML = `<span class="dot"></span>Letzter Refresh: ${now}`;
        } else {
            el.className = 'last-update error';
            el.innerHTML = `<span class="dot"></span>Refresh-Fehler: ${escapeHtml(msg || 'Netzwerk')} (${now})`;
        }
    }

    // ===== API: Whoami =====
    async function loadWhoAmI() {
        try {
            const res = await fetch('/whoami');
            const data = await res.json();
            if (data.logged_in) {
                employee = data.employee;
                document.getElementById('who-badge').style.display = 'inline-flex';
                document.getElementById('who-name').textContent = employee.name;
                const btn = document.getElementById('login-btn');
                btn.textContent = 'Logout';
                btn.classList.remove('success');
                btn.classList.add('danger');
                btn.onclick = logout;
                unlockScreen();
                loadItems();
            } else {
                employee = null;
                document.getElementById('who-badge').style.display = 'none';
                const btn = document.getElementById('login-btn');
                btn.textContent = 'Login';
                btn.classList.add('success');
                btn.classList.remove('danger');
                btn.onclick = showLogin;
                lockScreen();
            }
        } catch (err) {
            console.error('Whoami fehlgeschlagen:', err);
        }
    }

    // ===== API: Branding live nachladen =====
    async function loadBranding() {
        try {
            const res = await fetch('/api/branding');
            const cfg = await res.json();
            applyBranding(cfg);
        } catch (err) {
            console.warn('Branding-Reload fehlgeschlagen:', err);
        }
    }

    function applyBranding(cfg) {
        if (!cfg) return;
        const root = document.documentElement;
        // Hell/Dunkel kommt jetzt ueber den Theme-Toggle + data-theme-Attribut
        // (theme.css), nicht mehr ueber eine feste background_color - so
        // uebernimmt ein Toggle von einem anderen Geraet (z.B. Kiosk) auch
        // hier automatisch beim naechsten Branding-Poll (alle 30s).
        if (cfg.theme && root.getAttribute('data-theme') !== cfg.theme) {
            root.setAttribute('data-theme', cfg.theme);
            const toggle = document.querySelector('[data-theme-toggle]');
            if (toggle) toggle.textContent = cfg.theme === 'dark' ? '☀️' : '🌙';
        }
        if (cfg.primary_color) root.style.setProperty('--primary', cfg.primary_color);
        if (cfg.header_gradient_from) root.style.setProperty('--header-from', cfg.header_gradient_from);
        if (cfg.header_gradient_to) root.style.setProperty('--header-to', cfg.header_gradient_to);
        if (cfg.urgent_color) root.style.setProperty('--urgent', cfg.urgent_color);
        if (cfg.overdue_color) root.style.setProperty('--overdue', cfg.overdue_color);
        if (cfg.done_color) root.style.setProperty('--done', cfg.done_color);
        // Logo und Hotel-Name schließen sich gegenseitig aus — bei Logo kein Emoji+Name-Spam
        const logo = document.getElementById('logo');
        const hotelName = document.getElementById('hotel-name');
        const hasLogo = !!cfg.logo_url;
        if (logo) {
            if (hasLogo) {
                logo.src = cfg.logo_url;
                logo.style.display = 'inline-block';
            } else {
                logo.style.display = 'none';
            }
        }
        if (hotelName) {
            if (hasLogo) {
                hotelName.style.display = 'none';
            } else {
                hotelName.style.display = '';
                if (cfg.hotel_name) hotelName.textContent = '🏨 ' + cfg.hotel_name;
            }
        }
    }

    // ===== API: Network-Info =====
    async function loadNetworkInfo() {
        try {
            const res = await fetch('/api/network');
            const info = await res.json();
            const port = info.port || 5000;
            const lanEl = document.getElementById('ip-lan');
            const hostEl = document.getElementById('ip-host');
            if (lanEl) lanEl.textContent = info.lan_ip ? `${info.lan_ip}:${port}` : '—';
            if (hostEl) hostEl.textContent = info.hostname || '—';
        } catch (err) {
            console.warn('Network-Info laden fehlgeschlagen:', err);
        }
    }

    // ===== Render =====
    function renderItems() {
        const container = document.getElementById('items-container');
        const statsLine = document.getElementById('stats-line');

        if (items.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">✨</div>
                    <div class="title">Keine offenen Aufgaben</div>
                    <div>Alles erledigt — du kannst neue Aufgaben über <a href="/form" target="_blank" style="color:var(--primary);text-decoration:underline;">+ Neu</a> hinzufügen.</div>
                </div>
            `;
            statsLine.textContent = '';
            return;
        }

        // Sort
        let sorted = [...items];
        if (currentSort === 'urgent') {
            sorted.sort((a, b) => {
                const now = new Date();
                const aOverdue = a.deadline && new Date(a.deadline) < now;
                const bOverdue = b.deadline && new Date(b.deadline) < now;
                if (aOverdue !== bOverdue) return aOverdue ? -1 : 1;
                if (a.deadline && b.deadline) return new Date(a.deadline) - new Date(b.deadline);
                if (a.deadline) return -1;
                if (b.deadline) return 1;
                return new Date(a.created_at) - new Date(b.created_at);
            });
        } else {
            sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        }

        const now = new Date();
        const urgentCount = items.filter(i => {
            if (!i.deadline) return false;
            const d = new Date(i.deadline);
            return d > now && (d - now) < 4 * 60 * 60 * 1000;
        }).length;
        const overdueCount = items.filter(i => i.deadline && new Date(i.deadline) < now).length;
        statsLine.textContent = `${items.length} offen${overdueCount ? ` · ${overdueCount} überfällig` : ''}${urgentCount ? ` · ${urgentCount} dringend` : ''}`;

        container.innerHTML = '<div class="items-grid">' + sorted.map(item => {
            let deadlineClass = '';
            let itemClass = '';
            if (item.deadline) {
                const dl = new Date(item.deadline);
                const diffMs = dl - now;
                if (diffMs < 0) {
                    deadlineClass = 'overdue';
                    itemClass = 'overdue';
                } else if (diffMs < 4 * 60 * 60 * 1000) {
                    deadlineClass = 'urgent';
                    itemClass = 'urgent';
                }
            }
            const deadlineText = item.deadline_display ? `Bis ${item.deadline_display}` : 'Keine Frist';
            const personText = item.assigned_to_name ? `→ ${escapeHtml(item.assigned_to_name)}` : '';
            const canEdit = !!employee;

            return `
                <div class="item-card ${itemClass}" data-id="${item.id}">
                    <button class="item-checkbox ${canEdit ? '' : 'disabled'}"
                            onclick="markDone(${item.id}, event)"
                            ${canEdit ? '' : 'disabled'}
                            title="${canEdit ? 'Als erledigt markieren' : 'Login erforderlich'}"></button>
                    <div class="item-body">
                        <div class="item-text">${escapeHtml(item.text)}</div>
                        <div class="item-meta">
                            <span class="item-deadline ${deadlineClass}">${escapeHtml(deadlineText)}</span>
                            ${personText ? `<span class="item-person">${personText}</span>` : ''}
                            <span class="item-creator">von ${escapeHtml(item.created_by_name)}</span>
                        </div>
                    </div>
                    <div class="item-actions">
                        <button class="icon-btn"
                                onclick="confirmDelete(${item.id})"
                                ${canEdit ? '' : 'disabled'}
                                title="${canEdit ? 'Löschen' : 'Login erforderlich'}">🗑</button>
                    </div>
                </div>
            `;
        }).join('') + '</div>';
    }

    // ===== Mark Done =====
    async function markDone(itemId, event) {
        event.stopPropagation();
        if (!employee) { showLogin(); return; }
        try {
            const res = await fetch(`/items/${itemId}/done`, { method: 'POST' });
            const data = await res.json();
            if (data.ok) {
                loadItems();
                showToast('✓ Erledigt', 'success');
            } else {
                showToast('Fehler: ' + (data.error || 'unknown'), 'error');
            }
        } catch (err) {
            showToast('Netzwerkfehler: ' + err.message, 'error');
        }
    }

    // ===== Delete mit Confirm =====
    function confirmDelete(itemId) {
        if (!employee) { showLogin(); return; }
        const card = document.querySelector(`.item-card[data-id="${itemId}"]`);
        const text = card ? card.querySelector('.item-text').textContent : 'dieses Item';
        if (confirm(`Item wirklich löschen?\n\n"${text.slice(0, 100)}${text.length > 100 ? '…' : ''}"`)) {
            deleteItem(itemId);
        }
    }

    async function deleteItem(id) {
        try {
            const res = await fetch(`/items/${id}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.ok) {
                loadItems();
                showToast('✓ Gelöscht', 'success');
            } else {
                showToast('Fehler: ' + (data.error || 'unknown'), 'error');
            }
        } catch (err) {
            showToast('Löschen fehlgeschlagen: ' + err.message, 'error');
        }
    }

    // ===== Login =====
    function showLogin() {
        document.getElementById('login-modal').classList.add('show');
        document.getElementById('login-error').textContent = '';
        const input = document.getElementById('code-input');
        input.value = '';
        setTimeout(() => input.focus(), 50);
    }
    function hideLogin() {
        document.getElementById('login-modal').classList.remove('show');
    }

    async function submitLogin(event) {
        event.preventDefault();
        const input = document.getElementById('code-input');
        const code = input.value.trim();
        if (code.length !== 4) {
            document.getElementById('login-error').textContent = 'Bitte 4 Ziffern eingeben';
            return false;
        }
        const submitBtn = document.getElementById('login-submit');
        submitBtn.disabled = true;
        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            });
            const data = await res.json();
            if (data.ok) {
                hideLogin();
                loadWhoAmI();
                showToast(`Eingeloggt als ${data.employee.name}`, 'success');
            } else {
                document.getElementById('login-error').textContent = data.error || 'Login fehlgeschlagen';
                input.select();
            }
        } catch (err) {
            document.getElementById('login-error').textContent = 'Netzwerkfehler';
        } finally {
            submitBtn.disabled = false;
        }
        return false;
    }

    async function logout() {
        try {
            await fetch('/logout', { method: 'POST' });
            showToast('Ausgeloggt', 'success');
        } catch (err) {
            showToast('Logout fehlgeschlagen', 'error');
        }
        lockScreen();
        loadWhoAmI();
    }

    // ===== Toast =====
    function showToast(message, type = '') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast' + (type ? ' ' + type : '');
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s';
            setTimeout(() => toast.remove(), 300);
        }, 2500);
    }

    function copyToClipboard(text) {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => showToast(`📋 Kopiert: ${text}`, 'success'));
        }
    }

    // ===== Utils =====
    function escapeHtml(s) {
        if (!s) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
</script>

<script src="/static/js/theme.js"></script>
</body>
</html>
