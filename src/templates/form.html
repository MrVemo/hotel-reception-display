<!DOCTYPE html>
<html lang="de" data-theme="{{ branding.theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="{{ branding.primary_color }}">
    <title>Neues Item — {{ branding.hotel_name }}</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        /* ===== Reset & Basis ===== */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration: none; }

        /* ===== Branding-Akzente (theme.css liefert Hell/Dunkel) ===== */
        :root {
            --primary: {{ branding.primary_color }};
            --header-from: {{ branding.header_gradient_from }};
            --header-to: {{ branding.header_gradient_to }};
            --urgent: {{ branding.urgent_color }};
            --overdue: {{ branding.overdue_color }};
            --done: {{ branding.done_color }};
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--text);
        }

        .back-btn {
            background: var(--header-to);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            min-height: 44px;
        }

        .back-btn:active {
            background: var(--surface);
        }

        .field {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 1rem;
            margin-bottom: 8px;
            color: var(--text-dim);
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            background: var(--surface);
            border: 2px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            min-height: 44px;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            font-family: inherit;
        }

        /* Quick-Buttons für Deadline */
        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .quick-btn {
            background: var(--header-to);
            color: white;
            border: 2px solid transparent;
            padding: 14px 8px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            min-height: 60px;
            text-align: center;
            line-height: 1.2;
        }

        .quick-btn:active {
            background: var(--surface);
        }

        .quick-btn.selected {
            background: var(--primary);
            border-color: var(--primary); filter: brightness(0.85);
        }

        .quick-btn small {
            display: block;
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 4px;
        }

        .submit-btn {
            background: var(--done);
            color: white;
            border: none;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            min-height: 60px;
            margin-top: 16px;
        }

        .submit-btn:active {
            background: var(--done); filter: brightness(0.9);
        }

        .submit-btn:disabled {
            background: var(--overdue);
            cursor: not-allowed;
        }

        .cancel-btn {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            min-height: 44px;
        }

        .error {
            color: var(--overdue);
            background: var(--surface-alt);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .who {
            background: var(--surface);
            padding: 10px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            color: var(--urgent);
            font-size: 0.95rem;
        }

        .hint {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* Login-Overlay (kopiert von display.html) */
        .login-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--overlay);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        .login-overlay.show { display: flex; }

        .login-overlay h2 { font-size: 1.5rem; }

        .code-display {
            display: flex;
            gap: 16px;
            margin: 8px 0;
        }
        .code-dot {
            width: 50px;
            height: 65px;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: white;
            transition: all 0.15s;
        }
        .code-dot.filled {
            border-color: var(--primary);
            background: var(--header-to);
        }
        .code-dot.error {
            border-color: var(--overdue);
            background: var(--surface-alt);
            animation: shake 0.4s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .touch-keyboard {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(4, 70px);
            gap: 10px;
            margin: 16px 0;
        }
        .kb-btn {
            background: var(--header-to);
            color: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .kb-btn:active {
            transform: scale(0.95);
            background: var(--surface);
        }
        .kb-btn.kb-clear,
        .kb-btn.kb-back {
            background: var(--text-dim);
            font-size: 1.4rem;
        }
        .login-buttons {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .login-submit {
            background: var(--done);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            min-height: 50px;
        }

        .login-cancel {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .login-error {
            color: var(--overdue);
            font-size: 1rem;
            min-height: 1.5rem;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='touch-keyboard.css') }}">
</head>
<body>
    <div class="container">
        <header>
                    <header class="site-header">
            <div class="brand">
                <h1>📝 Neues Item</h1>
            </div>
            <div class="controls">
                <a class="btn ghost" href="/display-web">📺 Anzeige</a>
                <button class="theme-toggle" data-theme-toggle title="Design umschalten">🌙</button>
                <div class="menu-wrap">
                    <button class="menu-trigger" aria-expanded="false" title="Weitere Optionen">⋮</button>
                    <div class="menu-dropdown">
                        <a href="/"><span class="icon">↩️</span> Zurück zur Übersicht</a>
                        <a href="/form"><span class="icon">✏️</span> Neues Item</a>
                        <a href="/handover"><span class="icon">📋</span> Übergabe</a>
                    </div>
                </div>
            </div>
        </header>

        <div class="who" id="who">Bitte einloggen</div>

        <div class="error" id="error"></div>

        <form id="item-form">
            <div class="field">
                <label for="text">Was ist zu tun?</label>
                <textarea
                    id="text"
                    name="text"
                    placeholder="z.B. Zimmer 207: Handtücher fehlen"
                    required
                    autocomplete="off"
                ></textarea>
                <div class="hint">Konkret und kurz. Mit Zimmernummer oder Name wenn möglich.</div>
            </div>

            <div class="field">
                <label for="deadline">Bis wann?</label>
                <select id="deadline" name="deadline">
                    <option value="">— Schnellauswahl —</option>
                    <option value="+1h">In 1 Stunde</option>
                    <option value="+2h">In 2 Stunden</option>
                    <option value="+4h">In 4 Stunden</option>
                    <option value="heute-18" selected>Heute 18:00</option>
                    <option value="morgen-09">Morgen 09:00</option>
                    <option value="morgen-12">Morgen 12:00</option>
                    <option value="morgen-18">Morgen 18:00</option>
                    <option value="keine">Keine Frist</option>
                    <option value="custom">Eigene Eingabe…</option>
                </select>
                <input
                    type="text"
                    id="custom-deadline"
                    name="custom-deadline"
                    placeholder="YYYY-MM-DD HH:MM"
                    style="display: none; margin-top: 12px;"
                    pattern="[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}"
                >
                <div class="hint">Standard ist heute 18:00.</div>
            </div>

            <div class="field">
                <label for="assigned_to">Zuweisen an (optional)</label>
                <select id="assigned_to" name="assigned_to">
                    <option value="">— Niemanden zuweisen —</option>
                </select>
                <div class="hint">Welcher Mitarbeiter kümmert sich darum?</div>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">✅ Eintragen</button>
            <button type="button" class="cancel-btn" onclick="window.location='/'">Abbrechen</button>
        </form>
    </div>

    <!-- Login Overlay mit Touch-Tastatur -->
    <div class="login-overlay" id="login-overlay">
        <h2>Mitarbeiter-Login</h2>
        <p style="color: var(--text-dim); font-size:0.9rem;">4-stelligen Code eingeben:</p>

        <div class="code-display">
            <div class="code-dot" data-idx="0"></div>
            <div class="code-dot" data-idx="1"></div>
            <div class="code-dot" data-idx="2"></div>
            <div class="code-dot" data-idx="3"></div>
        </div>

        <div class="touch-keyboard">
            <button class="kb-btn" data-key="1">1</button>
            <button class="kb-btn" data-key="2">2</button>
            <button class="kb-btn" data-key="3">3</button>
            <button class="kb-btn" data-key="4">4</button>
            <button class="kb-btn" data-key="5">5</button>
            <button class="kb-btn" data-key="6">6</button>
            <button class="kb-btn" data-key="7">7</button>
            <button class="kb-btn" data-key="8">8</button>
            <button class="kb-btn" data-key="9">9</button>
            <button class="kb-btn kb-clear" data-key="clear" title="Alle löschen">⌫</button>
            <button class="kb-btn" data-key="0">0</button>
            <button class="kb-btn kb-back" data-key="back" title="Letzte Ziffer">←</button>
        </div>

        <div class="login-error" id="login-error"></div>

        <div class="login-buttons">
            <button class="login-submit" onclick="submitLogin()">Einloggen</button>
            <button class="login-cancel" onclick="hideLogin()">Abbrechen</button>
        </div>
    </div>

    <script>
        let employee = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadWhoAmI();
            loadEmployees();
            setupDeadlineHandler();
        });

        async function loadWhoAmI() {
            try {
                const res = await fetch('/whoami');
                const data = await res.json();
                if (data.logged_in) {
                    employee = data.employee;
                    document.getElementById('who').textContent = `Eingeloggt als: ${employee.name}`;
                    document.getElementById('submit-btn').disabled = false;
                } else {
                    employee = null;
                    document.getElementById('who').textContent = '⚠️ Bitte einloggen zum Eintragen';
                    document.getElementById('submit-btn').disabled = true;
                    showLogin();
                }
            } catch (err) {
                console.error('Whoami failed:', err);
            }
        }

        async function loadEmployees() {
            // Aktuell keine API für alle Mitarbeiter → Default nur Admin
            // TODO Phase 6: GET /api/employees Endpoint
            const select = document.getElementById('assigned_to');
            try {
                // Falls Endpoint existiert, nutzen — sonst Default (Admin only)
                const res = await fetch('/api/employees', { method: 'GET' });
                if (res.ok) {
                    const data = await res.json();
                    data.employees.forEach(emp => {
                        const opt = document.createElement('option');
                        opt.value = emp.id;
                        opt.textContent = emp.name;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                // Endpoint existiert noch nicht — Default
                console.log('Employees-Endpoint noch nicht verfügbar');
            }
        }

        function setupDeadlineHandler() {
            const select = document.getElementById('deadline');
            const custom = document.getElementById('custom-deadline');
            select.addEventListener('change', () => {
                if (select.value === 'custom') {
                    custom.style.display = 'block';
                    custom.required = true;
                } else {
                    custom.style.display = 'none';
                    custom.required = false;
                }
            });
        }

        function resolveDeadline() {
            const sel = document.getElementById('deadline').value;
            const custom = document.getElementById('custom-deadline').value;
            const now = new Date();

            switch (sel) {
                case '+1h': now.setHours(now.getHours() + 1); break;
                case '+2h': now.setHours(now.getHours() + 2); break;
                case '+4h': now.setHours(now.getHours() + 4); break;
                case 'heute-18': now.setHours(18, 0, 0, 0); break;
                case 'morgen-09': now.setDate(now.getDate() + 1); now.setHours(9, 0, 0, 0); break;
                case 'morgen-12': now.setDate(now.getDate() + 1); now.setHours(12, 0, 0, 0); break;
                case 'morgen-18': now.setDate(now.getDate() + 1); now.setHours(18, 0, 0, 0); break;
                case 'keine': return null;
                case 'custom': return custom || null;
                default: now.setHours(18, 0, 0, 0); // Fallback
            }

            // Format: YYYY-MM-DD HH:MM
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
        }

        document.getElementById('item-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('error');
            errBox.classList.remove('show');

            if (!employee) {
                showLogin();
                return;
            }

            const text = document.getElementById('text').value.trim();
            if (!text) {
                errBox.textContent = 'Bitte Text eingeben';
                errBox.classList.add('show');
                return;
            }

            const deadline = resolveDeadline();
            const assignedTo = document.getElementById('assigned_to').value || null;

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Speichere…';

            try {
                const res = await fetch('/items', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text,
                        deadline,
                        assigned_to: assignedTo
                    })
                });
                const data = await res.json();

                if (data.ok) {
                    // Success → zurück zum Display
                    window.location = '/';
                } else {
                    errBox.textContent = data.error || 'Fehler beim Speichern';
                    errBox.classList.add('show');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '✅ Eintragen';
                }
            } catch (err) {
                errBox.textContent = 'Netzwerkfehler: ' + err.message;
                errBox.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = '✅ Eintragen';
            }
        });

        // ===== Login (gleich wie display.html) =====
        function showLogin() {
            document.getElementById('login-overlay').classList.add('show');
            document.getElementById('login-error').textContent = '';
            if (window.__clearCodeBuffer) window.__clearCodeBuffer();
        }

        function hideLogin() {
            document.getElementById('login-overlay').classList.remove('show');
        }

        async function submitLogin() {
            const digits = window.__getCodeBuffer ? window.__getCodeBuffer() : '';
            if (digits.length !== 4) {
                document.getElementById('login-error').textContent = 'Bitte 4 Ziffern eingeben';
                return;
            }
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: digits })
                });
                const data = await res.json();
                if (data.ok) {
                    hideLogin();
                    loadWhoAmI();
                } else {
                    document.getElementById('login-error').textContent = data.error || 'Login fehlgeschlagen';
                }
            } catch (err) {
                document.getElementById('login-error').textContent = 'Netzwerkfehler';
            }
        }

        async function logout() {
            await fetch('/logout', { method: 'POST' });
            loadWhoAmI();
        }

        document.addEventListener('input', (e) => {
            if (e.target.classList.contains('code-digit')) {
                const idx = parseInt(e.target.dataset.idx);
                if (e.target.value && idx < 3) {
                    document.querySelector(`.code-digit[data-idx="${idx + 1}"]`).focus();
                }
                if (idx === 3 && e.target.value) {
                    submitLogin();
                }
            }
        });
    </script>
    <script src="{{ url_for('static', filename='touch-keyboard.js') }}"></script>
    <script src="/static/js/theme.js"></script>
</body>
</html>
